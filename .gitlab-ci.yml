stages: [deploy]

deploy:
  stage: deploy
  tags: [local]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - docker compose -f docker-compose.yml -p taskhub up -d --build --remove-orphans
    - docker compose -f docker-compose.yml -p taskhub ps